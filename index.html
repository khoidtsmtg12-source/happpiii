<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gửi bạn đọc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500&family=Pacifico&family=Playpen+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --lw:min(88vw,420px,60vh);
  --W:calc(var(--lw)*.9);
  --H:calc(var(--W)*.64);
  --ink:#2f3a52; --coral:#d1495b;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  display:grid;place-items:center;overflow:hidden;
  background:linear-gradient(180deg,#1e2a4f 0%,#3d4a82 36%,#a47aa0 66%,#f4b78f 100%);
  font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink);
  -webkit-tap-highlight-color:transparent;
}

/* ================= BẦU TRỜI & TRANG TRÍ ================= */
.world{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.glow{position:absolute;left:-20%;right:-20%;bottom:-25%;height:70%;
  background:radial-gradient(closest-side,#ffd9a866,transparent)}
.stars{position:absolute;inset:0 0 45% 0;animation:tw 4s ease-in-out infinite alternate;
  background-image:
    radial-gradient(1.6px 1.6px at 30px 40px,#fff,transparent),
    radial-gradient(1.2px 1.2px at 120px 90px,#ffe9f3,transparent),
    radial-gradient(1.8px 1.8px at 200px 160px,#fff,transparent),
    radial-gradient(1px 1px at 80px 190px,#d6e6ff,transparent);
  background-size:230px 230px}
.stars.b{background-size:170px 170px;background-position:60px 40px;animation-delay:-2s;opacity:.7}
@keyframes tw{from{opacity:.2}to{opacity:1}}
.moon{position:absolute;left:7%;top:5%;width:64px;height:64px}
.cloud{position:absolute;left:0;top:var(--t);width:var(--w);opacity:var(--o);
  animation:drift var(--d) linear infinite;animation-delay:var(--dl)}
@keyframes drift{from{transform:translateX(-40vw)}to{transform:translateX(125vw)}}
.feather{position:absolute;top:-40px;left:var(--x);width:14px;height:30px;opacity:.75;
  animation:fall var(--d) linear infinite;animation-delay:var(--dl)}
@keyframes fall{from{transform:translate(0,-6vh) rotate(0)}50%{transform:translate(26px,55vh) rotate(110deg)}to{transform:translate(-10px,112vh) rotate(220deg)}}
.hills{position:absolute;left:0;bottom:0;width:100%;height:26vh}
.sprout{position:absolute;bottom:var(--b);left:var(--x);width:var(--s);height:auto;transform-origin:50% 100%;animation:sway 3.4s ease-in-out infinite alternate;animation-delay:var(--dl)}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.fly{position:absolute;left:var(--x);bottom:var(--b);width:5px;height:5px;border-radius:50%;background:#fff3a8;box-shadow:0 0 8px 2px #ffe97a99;
  animation:glow 3.2s ease-in-out infinite alternate,bob 6s ease-in-out infinite alternate;animation-delay:var(--dl)}
@keyframes glow{from{opacity:.15}to{opacity:1}}
@keyframes bob{from{translate:0 0}to{translate:14px -22px}}

/* ================= PHONG BÌ + BỒ CÂU ================= */
.stage{position:relative;z-index:5;width:var(--W);height:var(--H);font-size:calc(var(--W)/20);
  transform-origin:50% -60%;
  animation:flyX 4.6s cubic-bezier(.2,.7,.3,1) both,flyY 4.6s cubic-bezier(.4,0,.3,1) both,sway2 4.6s ease-in-out both}
@keyframes flyX{from{translate:85vw 0}to{translate:0 0}}
@keyframes flyY{0%{transform:translateY(-18vh)}30%{transform:translateY(-26vh)}65%{transform:translateY(-10vh)}88%{transform:translateY(8px)}100%{transform:translateY(0)}}
@keyframes sway2{0%{rotate:-6deg}25%{rotate:7deg}50%{rotate:-5deg}75%{rotate:3deg}100%{rotate:0deg}}
.stage>*{position:absolute}
.stage>:not(.letter){transition:translate 2.2s cubic-bezier(.45,0,.2,1),opacity 1.6s ease}
.back{inset:0;z-index:1;background:#d9c3a0;border-radius:.5em;box-shadow:0 1.4em 2.6em #0005}
.front{inset:0;z-index:4}
.front>svg,.flap>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.addr{position:absolute;left:0;right:0;bottom:8%;text-align:center;font:400 1.25em/1 'Pacifico',cursive;color:#8a6f4d}
.flap{left:0;top:0;width:100%;height:55%;z-index:6;transform-origin:50% 0;
  transform:perspective(900px) rotateX(0deg);
  transition:transform 1.5s cubic-bezier(.6,0,.3,1),z-index 0s,translate 2.2s cubic-bezier(.45,0,.2,1),opacity 1.6s}
.open .flap{transform:perspective(900px) rotateX(180deg);z-index:2;
  transition:transform 1.5s cubic-bezier(.6,0,.3,1),z-index 0s .75s,translate 2.2s cubic-bezier(.45,0,.2,1),opacity 1.6s}
.read :is(.back,.front,.flap,.seal,.hint){translate:0 70vh;opacity:0}

/* dây + bồ câu */
.strings{left:25%;right:25%;top:-2.3em;height:2.3em;z-index:8;transition:opacity .9s}
.strings svg{width:100%;height:100%;display:block}
.delivered .strings{opacity:0}
.dove{left:calc(50% - 4.86em);top:-6.7em;width:9em;z-index:9}
.dove svg{width:100%;height:auto;display:block;overflow:visible}
.wing{transform-origin:66px 40px;animation:flap .5s ease-in-out infinite alternate}
.wing.b{animation-delay:-.12s}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(-.7)}}
.delivered .dove{animation:leave 3.8s cubic-bezier(.5,0,.7,.5) forwards}
@keyframes leave{0%{transform:translate(0,0) scale(1)}18%{transform:translate(0,-1.8em) scale(1)}100%{transform:translate(-125vw,-48vh) scale(.5)}}
.gone .dove,.gone .strings{display:none}

/* ================= CON DẤU ================= */
.seal{left:50%;top:55%;width:5em;height:5em;margin:-2.5em 0 0 -2.5em;z-index:7;border:0;padding:0;background:none;cursor:pointer;pointer-events:none}
.seal svg{position:relative;width:100%;height:100%;display:block}
.seal::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #d1495b;opacity:0}
.ready .seal{pointer-events:auto;animation:breathe 3.2s ease-in-out infinite}
.ready .seal::before{animation:ring 3.2s ease-out infinite}
.seal:focus-visible{outline:3px solid #fff;outline-offset:5px;border-radius:50%}
@keyframes breathe{50%{transform:scale(1.06)}}
@keyframes ring{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.8);opacity:0}}
.cracking .seal{animation:press 1s cubic-bezier(.4,0,.2,1) forwards;pointer-events:none}
.cracking .seal::before{animation:none}
@keyframes press{0%{transform:scale(1)}35%{transform:scale(.84)}100%{transform:scale(1.4);opacity:0}}
.hint{left:-20%;right:-20%;top:calc(100% + 2em);text-align:center;font:500 calc(var(--W)/20*.85)/1.4 'Be Vietnam Pro',sans-serif;
  color:#fff;letter-spacing:.04em;text-shadow:0 1px 6px #0006;opacity:0}
.ready .hint{opacity:1;transition:opacity 1.4s ease,translate 2.2s cubic-bezier(.45,0,.2,1)}
.cracking .hint{opacity:0}

/* ================= LÁ THƯ ================= */
.letter{left:50%;top:50%;width:var(--lw);height:calc(var(--lw)*1.4);z-index:3;
  --u:calc(var(--lw)/22);--lh:calc(var(--u)*2);font-size:var(--u);
  opacity:0;transform:translate(-50%,-50%) translateY(calc(var(--H)*.04)) scale(.4);
  transition:transform 1.9s cubic-bezier(.33,0,.2,1),opacity .3s}
.open .letter{opacity:1;transition:transform 1.9s cubic-bezier(.33,0,.2,1),opacity .3s .55s}
.rise .letter{transform:translate(-50%,-50%) translateY(calc(var(--H)*-.3)) scale(.5)}
.read .letter{transform:translate(-50%,-50%) scale(1);transition:transform 2.6s cubic-bezier(.4,0,.15,1),opacity .3s}
.paper{position:absolute;inset:0;border-radius:.5em;overflow:hidden;
  padding:calc(var(--u)*2) calc(var(--u)*1.7) 0 calc(var(--u)*4.4);
  background:
    linear-gradient(90deg,transparent calc(var(--u)*3.3),#f1a9ab calc(var(--u)*3.3),#f1a9ab calc(var(--u)*3.3 + 1.5px),transparent calc(var(--u)*3.3 + 1.5px)),
    repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--lh) - 1px),#c9dcef calc(var(--lh) - 1px),#c9dcef var(--lh)),
    #fffdf7;
  box-shadow:0 .6em 1.6em #0004}
.paper p{line-height:var(--lh);font:500 calc(var(--u)*.95)/var(--lh) 'Playpen Sans','Patrick Hand','Segoe Print',cursive;letter-spacing:.01em}
.paper .sal{font:400 calc(var(--u)*1.4)/var(--lh) 'Pacifico','Playpen Sans',cursive;color:var(--coral)}
.paper .gap{margin-top:var(--lh)}
.paper .end{margin-top:var(--lh);font:400 calc(var(--u)*1.6)/var(--lh) 'Pacifico','Playpen Sans',cursive;color:var(--coral);padding-left:calc(var(--u)*2)}
.kid{position:absolute;right:calc(var(--u)*1.6);top:calc(var(--u)*.3);width:calc(var(--u)*3.1);height:auto;rotate:-6deg;pointer-events:none}
.rv{opacity:0;translate:0 .7em;transition:opacity 1.5s ease,translate 1.5s cubic-bezier(.25,.6,.2,1)}
.read .rv{opacity:1;translate:0 0;transition-delay:calc(var(--i)*.7s + 1.8s)}

.replay{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));translate:-50% 0;z-index:20;
  font:500 .9rem/1 'Be Vietnam Pro',sans-serif;color:#fff;background:#1b244066;border:1px solid #ffffff55;border-radius:99px;padding:.7em 1.3em;
  cursor:pointer;opacity:0;pointer-events:none;transition:opacity .8s}
.replay.show{opacity:1;pointer-events:auto}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}}
</style>
</head>

<button class="replay" id="replay">Gấp thư lại</button>

<script>
(function(){
  var stage=document.getElementById('stage'),seal=document.getElementById('seal'),replay=document.getElementById('replay'),t=[];
  function later(fn,ms){t.push(setTimeout(fn,ms))}
  function clear(){t.forEach(clearTimeout);t=[]}
  function add(c){stage.classList.add(c)}
  function del(c){stage.classList.remove(c)}

  /* 1) bồ câu mang thư đến, thả xuống rồi bay đi */
  setTimeout(function(){add('delivered')},4700);
  setTimeout(function(){add('ready')},5600);
  setTimeout(function(){add('gone')},8700);

  /* 2) chạm con dấu để mở thư */
  seal.addEventListener('click',function(){
    if(!stage.classList.contains('ready')||stage.classList.contains('cracking'))return;
    clear();
    add('cracking');
    later(function(){add('open')},900);
    later(function(){add('rise')},2600);
    later(function(){add('read')},4700);
    later(function(){replay.classList.add('show')},11000);
  });

  /* 3) gấp thư lại */
  replay.addEventListener('click',function(){
    clear();replay.classList.remove('show');
    del('read');
    later(function(){del('rise')},2200);
    later(function(){del('open')},4200);
    later(function(){del('cracking')},6000);
  });
})();
</script>
